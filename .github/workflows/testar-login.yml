name: Testar login
on: { workflow_dispatch: {} }
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/testar-login.mjs
        env:
          SEGREDOS: ${{ toJSON(secrets) }}
