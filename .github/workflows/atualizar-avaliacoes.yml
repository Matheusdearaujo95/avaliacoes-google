# Atualiza as avaliações todo dia e salva em data/ (servido pelo GitHub Pages).
# Repositório público + GitHub Pages = grátis. Credenciais ficam em Settings > Secrets and variables > Actions.
name: Atualizar avaliações
on:
  schedule: [{ cron: "0 5 * * *" }]   # todo dia 05:00 UTC
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/buscar-avaliacoes.mjs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN_PRINCIPAL: ${{ secrets.GBP_REFRESH_TOKEN_PRINCIPAL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - name: Salvar dados
        if: always()
        run: |
          git config user.name "robo-avaliacoes"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Avaliações atualizadas $(date -u +%F)" && git push)
