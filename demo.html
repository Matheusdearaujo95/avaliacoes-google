<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demonstração do widget</title>
<style>body{margin:0;padding:24px 16px;font-family:system-ui,sans-serif;background:#f4f5f7;color:#222}main{max-width:1000px;margin:0 auto}h2{margin:40px 0 4px;font-size:18px}p{margin:0 0 8px;color:#666;font-size:14px}.escuro{background:#151719;border-radius:16px;padding:8px 16px}</style></head>
<body><main>
<h1>Widget de avaliações do Google</h1>
<p>Dados fictícios em <code>data/exemplo.json</code>. Na VPS, cada negócio terá o seu arquivo atualizado todo dia.</p>

<h2>Carrossel</h2>
<div class="avaliacoes-google" data-src="data/exemplo.json" data-layout="carrossel"></div>

<h2>Grade, só 4★ ou mais e com texto</h2>
<div class="avaliacoes-google" data-src="data/exemplo.json" data-layout="grade" data-min-estrelas="4" data-so-com-texto="sim" data-max="6" data-cor="#0b8043"></div>

<h2>Tema escuro</h2>
<div class="escuro"><div class="avaliacoes-google" data-src="data/exemplo.json" data-layout="carrossel" data-tema="escuro"></div></div>

<script src="widget/avaliacoes.js" defer></script>
</main></body></html>
